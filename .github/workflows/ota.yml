name: OTA Build & Publish

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'          # Tag-Pushes (z. B. v1.2.3) triggern auch
  workflow_dispatch:   # manueller Start im UI

env:
  TZ: Europe/Berlin
  DOCKER_IMAGE: sle118/squeezelite-esp32-idfv435
  IDF_TARGET: esp32
  OTA_ROOT: /var/www/ota/squeezelite
  PROJECT_NAME: squeezelite

jobs:
  build:
    runs-on: [self-hosted]
    steps:
      - name: Checkout (mit Submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Compute VERSION
        id: v
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          else
            SHORT=$(git rev-parse --short HEAD)
            TS=$(date +'%Y%m%d-%H%M')
            BR=${GITHUB_REF_NAME//\//-}
            echo "value=${BR}-${TS}-${SHORT}" >> $GITHUB_OUTPUT
          fi

      - name: Build (Docker)
        env:
          VERSION: ${{ steps.v.outputs.value }}
          DOCKER: 1
          DOCKER_IMAGE: ${{ env.DOCKER_IMAGE }}
          IDF_TARGET: ${{ env.IDF_TARGET }}
          OUT_DIR: out
        run: |
          bash scripts/build.sh
        timeout-minutes: 30

      - name: Publish to OTA webroot
        env:
          USE_SUDO: 1
          OTA_ROOT: ${{ env.OTA_ROOT }}
          VERSION: ${{ steps.v.outputs.value }}
          PROJECT_NAME: ${{ env.PROJECT_NAME }}
        run: |
          bash scripts/publish.sh

      - name: (Optional) Attach to GitHub Release (only on tags)
        if: ${{ github.ref_type == 'tag' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/squeezelite.bin
            out/recovery.bin
            out/sha256.txt
            out/metadata.json
