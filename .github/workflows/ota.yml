name: OTA Build & Publish

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  TZ: Europe/Berlin
  DOCKER_IMAGE: sle118/squeezelite-esp32-idfv435
  IDF_TARGET: esp32
  OTA_ROOT: /var/www/ota/squeezelite
  PROJECT_NAME: squeezelite

jobs:
  build:
    runs-on: [self-hosted]

    steps:
      - name: Checkout (mit Submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          clean: true
          
      - name: Compute VERSION
        id: v
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          else
            SHORT=$(git rev-parse --short HEAD)
            TS=$(date +'%Y%m%d-%H%M')
            BR=${GITHUB_REF_NAME//\//-}
            echo "value=${BR}-${TS}-${SHORT}" >> $GITHUB_OUTPUT
          fi

      # --- 1) Optional: sauberes Clean, falls build/out schon existieren
      - name: Pre-clean build artifacts (best effort)
        run: |
          rm -rf build out || true

      # --- 2) Docker-Build mit User-Mapping (verhindert root-Dateien)
      - name: Build (Docker)
        env:
          VERSION: ${{ steps.v.outputs.value }}
          DOCKER: 1
          DOCKER_IMAGE: ${{ env.DOCKER_IMAGE }}
          IDF_TARGET: ${{ env.IDF_TARGET }}
          OUT_DIR: out
          HOST_UID: ${{ github.run_id }}  # Platzhalter; wird unten überschrieben
          HOST_GID: 1000                  # Platzhalter; wird unten überschrieben
        shell: bash
        run: |
          set -euo pipefail
          # UID/GID vom Runner holen
          export HOST_UID=$(id -u)
          export HOST_GID=$(id -g)

          # Falls dein scripts/build.sh selbst 'docker run' macht:
          #   nutze die Variablen HOST_UID/HOST_GID darin, um -u UID:GID zu setzen (siehe Hinweis unten).
          bash scripts/build.sh

      # --- 3) Ownership nach dem Build sicherstellen (falls scripts/publish.sh lokal packt)
      - name: Fix workspace permissions (post build)
        if: always()
        run: |
          sudo chown -R $(id -u):$(id -g) "$GITHUB_WORKSPACE" || true

      - name: Publish to OTA webroot
        env:
          USE_SUDO: 1
          OTA_ROOT: ${{ env.OTA_ROOT }}
          VERSION: ${{ steps.v.outputs.value }}
          PROJECT_NAME: ${{ env.PROJECT_NAME }}
        run: |
          bash scripts/publish.sh

      - name: (Optional) Attach to GitHub Release (only on tags)
        if: ${{ github.ref_type == 'tag' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/squeezelite.bin
            out/recovery.bin
            out/sha256.txt
            out/metadata.json
